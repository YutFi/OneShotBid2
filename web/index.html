<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome - OneShotBid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #1a1a40;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            width: 600px;
            background-color: #263445;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .left-side {
            flex: 1;
            background-color: #1e2a38;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .left-side h1 {
            font-size: 32px;
            color: #ffffff;
            margin: 0;
        }

        .icons {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .icon {
            margin: 0 6px;
        }

        .right-side {
            flex: 1;
            background-color: #263445;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .right-side p {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 30px;
        }

        .right-side a.button {
            padding: 12px;
            background-color: #063970;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .right-side a.button:hover {
            background-color: #052a5f;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-side">
        <div class="icons">
            <span class="icon">🔨</span>
            <span class="icon">💰</span>
            <span class="icon">📦</span>
        </div>
        <h1>OneShotBid</h1>
    </div>
    <div class="right-side">
        <p>Welcome to OneShotBid — your trusted online auction platform. Click below to login and start bidding!</p>
        <a href="login.jsp" class="button">Go to Login</a>
    </div>
</div>

</body>
</html>
